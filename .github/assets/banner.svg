<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#042f2e"/><stop offset="1" stop-color="#064e3b"/></linearGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#bef264"/></linearGradient>
    <style>
      .squeeze{animation:sq 3s ease-in-out infinite;transform-origin:860px 108px}
      @keyframes sq{0%,20%{transform:scaleX(1);opacity:1}50%,100%{transform:scaleX(.25);opacity:0}}
      .short{animation:sh 3s ease-in-out infinite}@keyframes sh{0%,45%{opacity:0}65%,100%{opacity:1}}
      .click{animation:c 1.5s ease-out infinite}@keyframes c{from{r:4;opacity:1}to{r:22;opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g fill="#5eead4" opacity=".07" font-family="Consolas, Menlo, monospace" font-size="22">
    <text x="20" y="40">aZ9xQ2k</text><text x="300" y="300">Lm3PqR7</text><text x="560" y="40">0bT8nWc</text><text x="1040" y="300">Yh6UvE1</text>
  </g>
  <text x="66" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="900" fill="url(#t)" letter-spacing="-2">Ashorty</text>
  <text x="70" y="196" font-family="Consolas, Menlo, monospace" font-size="20" fill="#99f6e4">long URL in → 7-char Base62 out → 302 → click stats</text>
  <text x="70" y="250" font-family="Consolas, Menlo, monospace" font-size="15" fill="#6ee7b7" opacity=".8">React + Vite · Express · PostgreSQL · Vercel</text>
  <!-- long url squeezing -->
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <g class="squeeze">
      <rect x="640" y="88" width="500" height="40" rx="20" fill="#022c22" stroke="#14b8a6"/>
      <text x="660" y="113" fill="#5eead4">https://example.com/blog/2026/very/long/path?utm=…</text>
    </g>
    <g class="short">
      <rect x="760" y="88" width="230" height="40" rx="20" fill="#bef264"/>
      <text x="875" y="114" text-anchor="middle" fill="#052e16" font-weight="700" font-size="18">ashorty/aZ9xQ2k</text>
    </g>
  </g>
  <!-- chain link -->
  <g transform="translate(860 210)" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round">
    <path d="M-10 0h-30a26 26 0 0 0 0 52h30"/><path d="M30 0h30a26 26 0 0 1 0 52H30"/><line x1="-24" y1="26" x2="44" y2="26" stroke="#bef264"/>
  </g>
  <circle class="click" cx="1060" cy="236" r="4" fill="none" stroke="#bef264" stroke-width="3"/>
  <text x="1060" y="290" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#bef264">+1 click</text>
</svg>
